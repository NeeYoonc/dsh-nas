name: Watch official DSH releases

# ── 官方更新自动对齐（轮询 30 分钟；自建仓 2026-11-05：去掉「成功后暂停 6 小时」）──────
# 为什么用轮询：官方不会给我们发 webhook，轮询是唯一可行的自动对齐手段；代价极小 ——
#   每 30 分钟一次 api.github.com 调用（实测 1~4 秒），且只在"确实需要构建"时才触发。
# 判定是无状态的（不依赖任何额外存储），三个条件全部满足才触发：
#   ① 官方最新 tag ≠ 本仓最新 Release tag（还没对齐）
#   ② 当前没有构建在跑（build.yml 是 cancel-in-progress: true，插队会把它取消掉）
#   ③ 同一版本连续失败 < 3 次（成功不节流：上游一发新版立刻追；只对卡住的版本刹车，
#      否则没有冷却时一个编不过的版本会被每 30 分钟重派一次，几天就能烧光 Actions 额度）
# 与 build.yml 的"方案 B（失败时自动学习依赖并入库 + 自动重建）"配套，形成无人值守闭环。

on:
  schedule:
    - cron: '*/30 * * * *'      # 每 30 分钟
  workflow_dispatch:            # 手动触发（便于随时验证判定逻辑）

permissions:
  contents: read
  actions: write                # 需要 dispatch build.yml

concurrency:
  group: watch-official
  cancel-in-progress: false     # 看门狗自身不并发，但也绝不取消别人

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 判定是否需要构建
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          API="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
          AUTH=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")

          # ① 官方最新 tag（api.github.com，匿名亦可；脚本自身不读凭据文件）
          OFFICIAL="$(bash scripts/fetch-dsh-latest.sh --print-tag 2>/dev/null | tail -1)"
          echo "官方最新 tag: ${OFFICIAL:-（取不到）}"
          if [ -z "$OFFICIAL" ]; then
            echo "… 取不到官方 tag（网络/限流）→ 本次跳过，等下一轮"
            exit 0
          fi

          # ② 本仓最新 Release tag = 上一次已构建并发布的版本
          MINE="$(curl -sS --max-time 20 "${AUTH[@]}" "$API/releases/latest" \
                  | python3 -c 'import sys,json;print(json.load(sys.stdin).get("tag_name",""))' 2>/dev/null || true)"
          echo "本仓已发布 tag: ${MINE:-（无 Release）}"
          if [ "$OFFICIAL" = "$MINE" ]; then
            echo "… 已与官方对齐（tag 相同）→ 无需构建"
            exit 0
          fi

          # ③ 有构建在跑就不插队（避免把正在跑的取消掉）
          RUNNING="$(curl -sS --max-time 20 "${AUTH[@]}" \
                     "$API/actions/workflows/build.yml/runs?status=in_progress&per_page=1" \
                     | python3 -c 'import sys,json;print(len(json.load(sys.stdin).get("workflow_runs") or []))' 2>/dev/null || echo 0)"
          if [ "${RUNNING:-0}" != "0" ]; then
            echo "… 已有构建在跑 → 本次跳过（不插队、不互相取消）"
            exit 0
          fi

          # ④ 同一版本连续失败保护（2026-11-05 去掉 6 小时冷却后必须防死循环）
          #   无节流时，某版真编不过会每 30 分钟被重派一次（每次 >10 分钟）→ 数天烧光额度。
          #   口径：成功不节流（上游一发新版立刻追）；只对【同一个版本】刹车 ——
          #   以官方该 tag 的发布时间为窗口统计失败次数，≥3 次即暂停；
          #   上游发下一版时 published_at 变新 → 窗口自然重置，自动恢复追版。
          AUTH2=(-H "Accept: application/vnd.github+json")
          [ -n "${GH_TOKEN:-}" ] && AUTH2+=(-H "Authorization: Bearer $GH_TOKEN")
          PUB="$(curl -sS --max-time 20 "${AUTH2[@]}" \
                 "https://api.github.com/repos/deepseek-ai/deepseek-harness/releases/tags/$OFFICIAL" \
                 | python3 -c 'import sys,json;print((json.load(sys.stdin) or {}).get("published_at",""))' 2>/dev/null || true)"
          echo "该版本发布时间: ${PUB:-（取不到）}"
          if [ -n "${PUB:-}" ]; then
            FAILS="$(curl -sS --max-time 25 "${AUTH[@]}" \
                      "$API/actions/workflows/build.yml/runs?per_page=100" \
                    | python3 -c 'import sys,json;d=json.load(sys.stdin) or {};rs=d.get("workflow_runs") or [];print(sum(1 for r in rs if (r.get("created_at") or "")>=sys.argv[1] and r.get("conclusion")=="failure"))' "$PUB" 2>/dev/null || echo 0)"
            echo "该版本发布以来失败次数: ${FAILS:-0}（阈值 3）"
            if [ "${FAILS:-0}" -ge 3 ]; then
              echo "… 同一版本已连续失败 ≥3 次 → 停止自动对齐，避免每 30 分钟重复构建烧额度"
              echo "   处置：修好后手动 workflow_dispatch（dsh_tag=$OFFICIAL），或等上游发下一版。"
              exit 0
            fi
          fi

          echo "… 判定：需要构建（官方 $OFFICIAL ≠ 本仓 $MINE，且该版本未连续失败 3 次）…"
          echo "need=yes" >> "$GITHUB_OUTPUT"
          echo "official=$OFFICIAL" >> "$GITHUB_OUTPUT"

      - name: 触发构建（对齐官方 tag）
        if: steps.decide.outputs.need == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.decide.outputs.official }}
        run: |
          set -e
          # ★ 显式钉住 dsh_tag（2026-11-05）：① 避免判定与真正构建之间又出新版导致版本漂移；
          #   ② build.yml 的 run-name 会带上该 tag，看门狗靠它统计"同一版本连续失败次数"。
          echo "  目标官方 tag: $TAG"
          # ★ 必须【两种架构都派发】（2026-10-18 真机 bug ✗）
          #   原来只发 {"ref":"main"} ✗ → arch 用默认 x86_64 ✗ → 自动构建永远只出 x86 ✗，
          #   新版本 Release 里没有 ARM 包 ✗（实测 dsh-v0.2.1-rc.1 / rc.2 只有 2 个 x86 资产 ✗）
          #   build.yml 并发组已按架构隔离（group: <workflow>-<arch>）✓ → 两次派发不互相取消 ✓
          for ARCH in x86_64 arm64; do
          curl -sS -o /dev/null -w "  触发构建($ARCH) HTTP %{http_code}\n" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/dispatches" \
            -d "{\"ref\":\"main\",\"inputs\":{\"arch\":\"$ARCH\",\"dsh_tag\":\"$TAG\"}}"
          done